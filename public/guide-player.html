<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Guide video</title>
  <style>
    html, body { margin: 0; background: #111; height: 100%; display: grid; place-items: center; }
    video { max-width: 100vw; max-height: 100vh; background: #000; }
  </style>
</head>
<body>
  <video id="v" src="/guide-motion.mp4" controls autoplay muted playsinline></video>
  <script>
    const v = document.getElementById('v');
    v.addEventListener('loadedmetadata', () => {
      document.title = `Guide ${v.duration.toFixed(2)}s ${v.videoWidth}x${v.videoHeight}`;
    });
  </script>
</body>
</html>
